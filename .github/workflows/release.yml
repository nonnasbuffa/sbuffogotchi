# A version tag builds an unsigned Sbuffogotchi.ipa and publishes it with the committed APK as a Release.
name: Build Sbuffogotchi

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx cap sync ios

      - name: Build the app (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Sbuffogotchi.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Sbuffogotchi.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Sbuffogotchi-ipa
          path: Sbuffogotchi.ipa

      - name: Publish the Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Sbuffogotchi.apk Sbuffogotchi.ipa \
            --title "Sbuffogotchi ${GITHUB_REF_NAME#v}" \
            --notes "**Android:** download Sbuffogotchi.apk and open it on your phone. If Android asks, allow installing apps from your browser or file manager. **iPhone:** Sbuffogotchi.ipa is unsigned, so sign and install it with your own tool (Sideloadly, AltStore...)."
