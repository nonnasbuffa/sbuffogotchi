@container room (min-width:740px){#pet{transform:scale(8)}}
@container room (min-width:840px){#pet{transform:scale(9)}}
@container room (min-width:940px){#pet{transform:scale(10)}}
@container room (min-width:1040px){#pet{transform:scale(11)}}
#miniList,#trainList,#bossList{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bossRow img{width:80px;height:80px}.bossRow{grid-template-columns:80px 1fr 116px}.bossRow button{font-size:17px;min-height:50px}
#bagList .bossRow{grid-template-columns:52px 1fr 104px}#bagList .bossRow img{width:52px;height:52px}#bagList .bossRow button{min-height:44px}
#s-whack,#s-order,#s-train,#s-boss,#s-mini{width:min(100%,620px)}#s-mini.wide{width:min(100%,1500px)}#s-mini.wide #padControls{width:min(100%,620px);margin:0 auto}
#miniCanvas{height:calc(100dvh - 210px)}#s-mini.pad #miniCanvas{height:calc(100dvh - 290px)}#whackGrid{width:min(100%,calc(100dvh - 250px));margin:0 auto}
#s-bag,#s-trainMenu{flex:none;height:calc(100dvh - 40px)}#bagList{flex:1;min-height:0;overflow-y:auto}
.toast{font-size:19px}
}
@media (min-width:900px) and (min-aspect-ratio:5/4) and (max-height:760px){
#s-home button{min-height:52px;font-size:18px}.infoCard{font-size:15px;gap:4px;padding:8px 12px}.infoHead b{font-size:19px}
}
@media (min-width:900px) and (min-aspect-ratio:5/4) and (max-height:660px){.infoItems,.infoLine:has(#infoDaily){display:none}#s-home button{min-height:46px;font-size:17px}#s-home .side{gap:6px}#s-home .stats{font-size:18px}}
</style>
</head>
<body>
<div id="app">
  <section class="screen" id="s-login">
    <h1>SBUFFOGOTCHI</h1>
    <p class="center dim" data-i18n="tagline"></p>
    <input id="user" data-i18n-ph="userPh" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
    <input id="pass" type="password" data-i18n-ph="passPh" autocomplete="current-password">
    <div class="row2"><button class="main" id="btnLogin" data-i18n="login"></button><button id="btnSignup" data-i18n="signup"></button></div>
    <p class="center dim" id="loginMsg"></p>
    <button class="link" id="btnOffline" data-i18n="offline"></button>
    <button class="link" data-settings data-i18n="settings"></button>
  </section>

  <section class="screen" id="s-home">
    <div class="top"><span class="stat"><img class="ic" src="sprites/icons/star.png" alt="" data-i18n-alt="level"><span id="lvl"></span></span><span class="stat streak"><img class="ic" src="sprites/icons/bowl.png" alt="" data-i18n-alt="streak"><span id="streak"></span></span><button class="link" id="btnAccount" style="min-height:0;padding:0"></button><button class="link iconBtn" id="btnAdmin" hidden><img class="ic" src="sprites/icons/admin.png" alt="" data-i18n-alt="adminTitle"></button><button class="link iconBtn" id="btnAch"><img class="ic" src="sprites/icons/trophy.png" alt="" data-i18n-alt="achTitle"><i class="dot" id="achDot" hidden></i></button><button class="link iconBtn" id="btnFriends"><img class="ic" src="sprites/icons/friends.png" alt="" data-i18n-alt="friends"></button><button class="link iconBtn" data-settings><img class="ic" src="sprites/icons/gear.png" alt="" data-i18n-alt="settings"></button></div>
    <div class="xp"><i id="xpFill"></i></div>
    <div class="stage"><div class="say" id="say"></div><div class="sprite" id="pet"></div><button class="link" id="cdPlayer"><img src="sprites/cd_player.png" alt="" data-i18n-alt="cdPlayer"></button></div>
    <div class="side">
    <div class="infoCard">
      <div class="infoHead"><b id="infoLevel"></b><span id="infoXp"></span></div>
      <div class="infoLine"><img class="ic" src="sprites/icons/bowl.png" alt=""><span id="infoStreak"></span></div>
      <div class="infoLine"><img class="ic" id="infoBossIcon" src="sprites/icons/trophy.png" alt=""><span id="infoBoss"></span></div>
      <div class="infoLine"><img class="ic" src="sprites/icons/star.png" alt=""><span id="infoDaily"></span></div>
      <div class="infoItems" id="infoItems"></div>
    </div>
    <div class="bars">
      <span><img class="ic" src="sprites/icons/apple.png" alt="" data-i18n-alt="food"></span><div class="bar"><i id="b-food" style="background:var(--gold)"></i></div>
      <span><img class="ic" src="sprites/icons/bolt.png" alt="" data-i18n-alt="energy"></span><div class="bar"><i id="b-energy" style="background:var(--blue)"></i></div>
      <span><img class="ic" src="sprites/icons/smile.png" alt="" data-i18n-alt="joy"></span><div class="bar"><i id="b-joy" style="background:var(--green)"></i></div>
    </div>
    <div class="row2"><button id="btnFeed"><img class="ic" src="sprites/icons/apple.png" alt=""><span data-i18n="feed"></span></button><button id="btnRest"><img class="ic" src="sprites/icons/bolt.png" alt=""><span data-i18n="energy"></span></button></div>
    <div class="row2"><button class="main" id="btnTrain"><img class="ic" src="sprites/icons/rice.png" alt=""><span data-i18n="train"></span></button><button class="boss" id="btnBoss"><img class="ic" src="sprites/icons/trophy.png" alt=""><span id="btnBossLabel"></span></button></div>
    <div class="row2"><button id="btnBag"><img class="ic" src="sprites/icons/backpack.png" alt=""><span data-i18n="bag"></span></button><button id="btnShop"><img class="ic" src="sprites/icons/shop.png" alt=""><span data-i18n="shop"></span></button></div>
    <div class="stats"><span class="stat"><img class="ic" src="sprites/icons/dumbbell.png" alt="" data-i18n-alt="strength"><span id="str"></span></span><span class="stat"><img class="ic" src="sprites/icons/trophy.png" alt="" data-i18n-alt="bossesBeaten"><span id="wins"></span></span><span class="stat"><img class="ic" src="sprites/icons/shield.png" alt="" data-i18n-alt="shields"><span id="shields"></span></span></div>
    </div>
  </section>

  <section class="screen" id="s-bag">
    <h2 data-i18n="bag"></h2>
    <p class="center dim" data-i18n="bagIntro"></p>
    <p class="center" id="bagStatus"></p>
    <div class="menuList" id="bagList"></div>
    <button data-home data-i18n="back"></button>
  </section>

  <section class="screen" id="s-shop">
    <h2 data-i18n="shop"></h2>
    <p class="center pokenBal"><img class="ic" src="sprites/icons/poken.png" alt=""><b id="pokenBal"></b></p>
    <div class="row"><button id="tabSell" data-i18n="shopSell"></button><button id="tabCds" data-i18n="shopCds"></button><button id="tabSkins" data-i18n="shopSkins"></button></div>
    <div class="menuList" id="shopList"></div>
    <button data-home data-i18n="back"></button>
  </section>

  <section class="screen" id="s-ach">
    <h2 data-i18n="achTitle"></h2>
    <p class="center dim" id="achCount"></p>
    <div class="menuList" id="achList"></div>
    <button data-home data-i18n="back"></button>
  </section>

  <section class="screen" id="s-friends">
    <h2 data-i18n="friends"></h2>
    <div class="addFriend"><input id="friendName" data-i18n-ph="friendNamePh" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="40"><button class="main" id="btnAddFriend" data-i18n="add"></button></div>
    <p class="center dim" id="friendsMsg"></p>
    <div class="menuList" id="friendList"></div>
    <button data-home data-i18n="back"></button>
  </section>

  <section class="screen" id="s-profile">
    <div class="profHead"><img src="sprites/icons/walker.png" alt=""><div><h2 id="profName"></h2><p class="dim" id="profSince"></p><p class="dim" id="profSeen"></p></div></div>
    <div class="bars" id="profBars"></div>
    <div class="profGrid" id="profGrid"></div>
    <div class="row1" id="profActs"></div>
    <button id="btnProfileBack" data-i18n="back"></button>
  </section>

  <section class="screen" id="s-settings">
    <h2 data-i18n="settings"></h2>
    <p class="center dim" data-i18n="language"></p>
    <div class="menuList" id="langList"></div>
    <button id="btnSettingsBack" data-i18n="back"></button>
  </section>

  <section class="screen" id="s-trainMenu">
    <h2 data-i18n="training"></h2>
    <p class="center dim" data-i18n="trainIntro"></p>
    <div class="menuList" id="trainList"></div>
    <button data-home data-i18n="back"></button>
  </section>


  <section class="screen" id="s-whack">
    <h2 data-i18n="whack"></h2>
    <p class="center dim" data-i18n="whackHint"></p>
    <div id="whackGrid"></div>
    <p class="center" id="whackInfo"></p>
  </section>

  <section class="screen" id="s-order">
    <h2 data-i18n="order"></h2>
    <p class="center dim" data-i18n="orderHint"></p>
    <p class="center" id="orderInfo"></p>
    <div id="orderPads"></div>
  </section>

  <section class="screen" id="s-mini">
    <h2 id="miniTitle"></h2>
    <p class="center" id="miniInfo"></p>
    <canvas id="miniCanvas" width="320" height="440"></canvas>
    <div id="padControls">
      <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
      <p class="keysHint dim" data-i18n="keysHint"></p>
      <button class="main" id="btnJump" data-i18n="jumpBtn"></button>
    </div>
    <button id="btnMiniQuit" data-i18n="quit"></button>
    <input id="keyCatcher" class="keyCatcher" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
  </section>

  <section class="screen" id="s-train">
    <h2 data-i18n="riceWrap"></h2>
    <p class="center dim" data-i18n="riceWrapHint"></p>
    <div class="stage" style="height:220px"><div class="sprite" id="trainPet"></div></div>
    <div class="meter" id="trainMeter"><div class="zone"></div><div class="mark"></div></div>
    <p class="center" id="trainInfo"></p>
    <button class="main" id="btnTrainTap" style="min-height:80px" data-i18n="wrapBtn"></button>
  </section>

  <section class="screen" id="s-bosses">
    <h2 data-i18n="bosses"></h2>
    <p class="center dim" data-i18n="bossesIntro"></p>
    <div id="bossList"></div>
    <button id="btnBossBack" data-i18n="back"></button>
  </section>

  <section class="screen" id="s-boss">
    <h2 id="bossName"></h2>
    <div class="bars"><span data-i18n="bossBar"></span><div class="bar"><i id="b-boss" style="background:var(--red)"></i></div><span data-i18n="youBar"></span><div class="bar"><i id="b-you" style="background:var(--green)"></i></div></div>
    <div class="fight"><div class="sprite" id="fightPet"></div><img id="bossArt" alt=""><div class="bowl" id="bowl"></div></div>
    <p class="center" id="bossInfo"></p>
    <button class="boss" id="btnBossTap" style="min-height:80px"></button>
  </section>
</div>
<div class="modal" id="giftAsk"><div class="panel center">
  <img class="giftAskPic" src="sprites/icons/gift.png" alt="">
  <h2 data-i18n="giftAskTitle"></h2>
  <p id="giftAskText"></p>
  <div class="giftAskItems" id="giftAskItems"></div>
  <div class="row2"><button id="btnGiftDecline" data-i18n="giftDecline"></button><button class="main" id="btnGiftAccept" data-i18n="giftAccept"></button></div>
</div></div>
<div class="modal" id="cdWin"><div class="panel center">
  <img class="giftAskPic" src="sprites/cd_player.png" alt="" style="width:104px;height:72px">
  <h2 data-i18n="cdPlayer"></h2>
  <p id="cdNow"></p>
  <div class="menuList" id="cdList"></div>
  <button id="btnCdShop" class="main" data-i18n="cdGoShop"></button>
  <div class="row2"><button id="btnCdStop" class="boss" data-i18n="cdStop"></button><button id="btnCdClose" data-i18n="close"></button></div>
</div></div>
<div class="modal" id="duelPick"><div class="panel">
  <h2 class="center" data-i18n="duelPickTitle"></h2>
  <p class="center dim" id="duelPickText"></p>
  <div class="menuList" id="duelGames"></div>
  <button id="btnDuelPickClose" data-i18n="close"></button>
</div></div>
<div class="modal" id="duelWait"><div class="panel center">
  <h2 data-i18n="duelPickTitle"></h2>
  <p id="duelWaitText"></p>
  <button id="btnDuelCancel" data-i18n="cancel"></button>
</div></div>
<div class="modal" id="duelAsk"><div class="panel center">
  <h2 data-i18n="duelAskTitle"></h2>
  <p id="duelAskText"></p>
  <div class="row2"><button id="btnDuelDecline" data-i18n="giftDecline"></button><button class="main" id="btnDuelAccept" data-i18n="giftAccept"></button></div>
</div></div>
<div class="modal" id="sellWin"><div class="panel center">
  <img class="giftAskPic" id="sellPic" src="" alt="">
  <h2 id="sellName"></h2>
  <div class="sellPick"><button id="btnSellMinus">−</button><input type="range" id="sellRange" min="1" max="1" value="1"><button id="btnSellPlus">+</button></div>
  <p id="sellCount"></p>
  <div class="row2"><button id="btnSellCancel" data-i18n="cancel"></button><button class="main" id="btnSellGo" data-i18n="sell"></button></div>
</div></div>
<div class="modal" id="daily"><div class="panel">
  <h2 data-i18n="dailyTitle"></h2>
  <div class="days" id="dailyDays"></div>
  <button class="main" id="btnClaim" data-i18n="claim"></button>
</div></div>
<div class="modal" id="death"><div class="panel center">
  <h2 data-i18n="deadTitle"></h2>
  <div class="deadStage"><div class="sprite" id="deadPet"></div></div>
  <p id="deadWhy"></p>
  <p class="dim" id="deadLost"></p>
  <p class="dim" id="deadHint"></p>
  <button class="main" id="btnRevive"></button>
  <button id="btnStartOver" data-i18n="startOver"></button>
</div></div>
<div class="adminWin" id="adminWin" role="dialog" aria-labelledby="adminWinTitle">
  <div class="winTitle" id="adminDrag"><img src="sprites/icons/admin.png" alt=""><b id="adminWinTitle" data-i18n="adminTitle"></b><button id="btnAdminClose" aria-label="Close">✕</button></div>
  <div class="menuList" id="adminList"></div>
</div>
<div class="adminWin" id="giftWin" role="dialog" aria-labelledby="giftWinTitle">
  <div class="winTitle giftTitle"><img src="sprites/icons/gift.png" alt=""><b id="giftWinTitle"></b><button id="btnGiftClose" aria-label="Close">✕</button></div>
  <div class="menuList" id="giftList"></div>
  <div class="giftFoot"><button class="main" id="btnGiftSend"></button></div>
</div>
<div id="tut" role="dialog" aria-live="polite">
  <div id="tutHole"></div>
  <div id="tutBox"><img id="tutPic" src="sprites/icons/walker.png" alt=""><p id="tutText"></p><div class="tutFoot"><button class="link" id="btnTutSkip" data-i18n="tutSkip"></button><span class="dim" id="tutCount"></span><button class="main" id="btnTutNext"></button></div></div>
</div>
<div class="toast" id="toast"></div>
<script src="i18n.js"></script>
<script src="music.js"></script>
<script src="notify.js"></script>
<script src="cloud.js"></script>
<script src="cds.js"></script>
<script src="game.js"></script>
</body>
</html>
