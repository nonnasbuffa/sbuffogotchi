/* ----- Modern look (Settings → Look). Only restyles the interface; sprites stay pixel art. ----- */
html.modern{--bg:#0e0d14;--win:rgba(16,15,24,.82);--panel:rgba(16,15,24,.82);--line:rgba(255,255,255,.08);--text:#ece6f5;--dim:#a79fb8;
  --o1:#f5a3c7;--o2:#b9a3ff;--glowc:#f5a3c7;--pink:var(--o1);--edge:linear-gradient(135deg,var(--o1),var(--o2));--r:14px}

html.modern body::before{content:"";position:fixed;inset:-60px;z-index:-1;background:url(sprites/room.png) center/cover;filter:blur(28px) saturate(1.8) brightness(.55);animation:hyprDrift 30s ease-in-out infinite alternate}
@keyframes hyprDrift{to{transform:scale(1.12) translate(2%,1%)}}
/* Every window: dark glass inside, a thin pink-to-lilac gradient border. */
html.modern button:not(.link):not(.hole):not(.pad),html.modern .bossRow,html.modern .infoCard,html.modern .day,html.modern .tile,html.modern .friendRow,
html.modern .panel,html.modern .meter,html.modern input,html.modern .stat,html.modern .bar,html.modern .xp,html.modern .hole,html.modern .pad{
  border:2px solid transparent;border-radius:var(--r);background:var(--winFill,linear-gradient(var(--win),var(--win))) padding-box,var(--edge) border-box;
  box-shadow:0 0 10px color-mix(in srgb,var(--glowc) 18%,transparent),0 8px 22px rgba(0,0,0,.35);backdrop-filter:blur(14px)}
html.modern .stage,html.modern .fight,html.modern #miniCanvas{border:2px solid var(--o1);border-radius:16px;box-shadow:0 0 12px color-mix(in srgb,var(--glowc) 25%,transparent),0 10px 30px rgba(0,0,0,.45)}
html.modern h1,html.modern h2{color:#fff}html.modern .dim{color:var(--dim)}
html.modern .screen.on{animation:hyprIn .22s ease-out}@keyframes hyprIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
html.modern button:not(.link){transition:transform .12s,box-shadow .2s,filter .2s}
html.modern button:not(.link):not(:disabled):hover{box-shadow:0 0 14px color-mix(in srgb,var(--glowc) 40%,transparent),0 8px 22px rgba(0,0,0,.35)}

/* Coloured buttons keep the dark glass and only tint the text and border. */
html.modern button.main:not(.link):not(.hole):not(.pad){--edge:linear-gradient(135deg,#7ee0a8,#5fcfb8);color:#9ff0c4}
html.modern button.boss:not(.link):not(.hole):not(.pad){--edge:linear-gradient(135deg,#ff8a9a,#f5a3c7);color:#ffb3bf}
html.modern button.picked:not(.link):not(.hole):not(.pad){--edge:linear-gradient(135deg,#ffd27a,#f5a3c7);color:#ffe0a3}
/* Buttons: soft tinted glass inside, each home button in its own colour. */
html.modern button:not(.link):not(.hole):not(.pad){--winFill:var(--btnFill,linear-gradient(180deg,rgba(78,58,102,.82),rgba(44,34,64,.82)))}
html.modern #btnFeed{--winFill:var(--btnFill,linear-gradient(180deg,rgba(150,82,52,.82),rgba(92,46,34,.82)))}
html.modern #btnRest{--winFill:var(--btnFill,linear-gradient(180deg,rgba(52,96,150,.82),rgba(30,56,98,.82)))}
html.modern #btnTrain{--winFill:var(--btnFill,linear-gradient(180deg,rgba(46,128,92,.84),rgba(26,80,60,.84)))}
html.modern #btnBoss{--winFill:var(--btnFill,linear-gradient(180deg,rgba(150,48,72,.84),rgba(96,26,48,.84)))}
html.modern #btnBag{--winFill:var(--btnFill,linear-gradient(180deg,rgba(128,96,54,.82),rgba(78,56,34,.82)))}

html.modern .toast{border-radius:12px;border:2px solid var(--o1);background:rgba(16,15,24,.92);box-shadow:0 0 12px color-mix(in srgb,var(--glowc) 30%,transparent)}

html.modern .infoHead b{color:var(--pink)}html.modern .infoHead{border-bottom-color:rgba(255,255,255,.1)}html.modern .infoItems{border-top-color:rgba(255,255,255,.1)}

html:not(.modern) .termWin{background:#120e1c;backdrop-filter:none;border:4px solid #000;border-radius:0;box-shadow:inset 0 0 0 3px var(--gold),0 20px 50px #000d;color:var(--text)}

<script>
// The player's Modern colours (Settings → Colours), kept on this device.
window.applyLookColors=function(c){var s=document.documentElement.style,rgba=function(hex,a){var n=parseInt(hex.slice(1),16);return'rgba('+(n>>16)+','+(n>>8&255)+','+(n&255)+','+a+')'};
  ['--btnFill','--win','--panelWin','--o1','--o2','--text','--glowc'].forEach(function(k){s.removeProperty(k)});if(!c)return;
  if(c.btn)s.setProperty('--btnFill','linear-gradient('+rgba(c.btn,.86)+','+rgba(c.btn,.86)+')');
  if(c.win){s.setProperty('--win',rgba(c.win,.82));s.setProperty('--panelWin',rgba(c.win,.92))}
  if(c.o1)s.setProperty('--o1',c.o1);if(c.o2)s.setProperty('--o2',c.o2);if(c.text)s.setProperty('--text',c.text);if(c.glow)s.setProperty('--glowc',c.glow)};
try{if(localStorage.getItem('sbuffogotchi.look')==='modern'){document.documentElement.classList.add('modern');applyLookColors(JSON.parse(localStorage.getItem('sbuffogotchi.colors')||'null'))}}catch(e){}
</script>
