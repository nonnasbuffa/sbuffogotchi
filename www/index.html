<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Sbuffogotchi</title>
<meta name="description" content="Raise your own pixel pal: keep your streak going, train with minigames and beat the vegetable bosses.">
<meta name="theme-color" content="#231d33">
<link rel="icon" type="image/png" href="sprites/icons/bowl.png">
<style>
:root{--bg:#231d33;--panel:#352c4a;--line:#55486f;--text:#f6eedd;--dim:#b9aec9;--gold:#ffc857;--green:#5fcf80;--red:#e8604c;--blue:#62b6e8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.35 "Courier New",monospace;user-select:none}
#app{max-width:480px;min-height:100%;margin:auto;padding:max(12px,env(safe-area-inset-top)) 16px 20px;display:flex;flex-direction:column;gap:12px}
.screen{display:none;flex-direction:column;gap:12px;flex:1}.screen.on{display:flex}
h1{font-size:26px;margin:18px 0 4px;text-align:center;color:var(--gold)}h2{font-size:20px;margin:0;text-align:center}
p{margin:0}.dim{color:var(--dim);font-size:14px}.center{text-align:center}
button{font:inherit;font-weight:bold;color:var(--text);background:var(--panel);border:3px solid var(--line);padding:12px 8px;min-height:48px;cursor:pointer}
button:active{transform:translateY(2px)}button:disabled{opacity:.45}
button.main{background:#2f7d5b;border-color:var(--green)}button.boss{background:#7c2f3c;border-color:var(--red)}button.link{background:none;border:0;color:var(--dim);font-weight:normal;text-decoration:underline}
input{font:inherit;color:var(--text);background:#1a1527;border:3px solid var(--line);padding:12px;width:100%;user-select:text}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:bold}
.streak{color:var(--gold)}.xp{height:12px;background:#1a1527;border:2px solid var(--line)}.xp i{display:block;height:100%;background:var(--blue)}
.stage{background:linear-gradient(#efe6d4 0 72%,#c9a77f 72%);border:3px solid var(--line);display:flex;justify-content:center;align-items:flex-end;height:290px;position:relative;overflow:hidden}
.sprite{width:44px;height:54px;image-rendering:pixelated;transform:scale(5);transform-origin:bottom center;margin-bottom:6px}
.say{position:absolute;top:8px;left:8px;right:8px;text-align:center;color:#2a2238;font-weight:bold;font-size:14px}
.bars{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center;font-size:14px}.bar{height:14px;background:#1a1527;border:2px solid var(--line)}.bar i{display:block;height:100%}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meter{position:relative;height:56px;background:#1a1527;border:3px solid var(--line)}.zone{position:absolute;top:0;bottom:0;background:var(--green)}.mark{position:absolute;top:-4px;bottom:-4px;width:6px;background:var(--text)}
.fight{display:flex;justify-content:space-between;align-items:flex-end;background:#40304f;border:3px solid var(--line);height:230px;padding:0 18px 8px;overflow:hidden}
.fight .sprite{transform:scale(3);margin-left:44px}#bossArt{image-rendering:pixelated;width:144px;height:144px}#bossArt:not(.hit){animation:bob 1.2s steps(1) infinite}@keyframes bob{50%{transform:translateY(-4px)}}
.hit{animation:hit .25s}@keyframes hit{0%,100%{translate:0}25%{translate:-8px}75%{translate:8px}}
#trainMeter{overflow:hidden;cursor:pointer}#trainMeter .zone{background:none}#trainMeter .zone.shut{z-index:1}
#trainMeter .zone::before,#trainMeter .zone::after{content:"";position:absolute;top:1px;width:48px;height:48px;background-size:100% 100%;image-rendering:pixelated;transition:transform .12s}
#trainMeter .zone::before{right:100%;background-image:url(sprites/leaf_right.png)}#trainMeter .zone::after{left:100%;background-image:url(sprites/leaf_left.png)}
#trainMeter .zone.shut::before{transform:translateX(var(--shut))}#trainMeter .zone.shut::after{transform:translateX(calc(var(--shut) * -1))}
#trainMeter .mark{top:17px;bottom:auto;width:24px;height:15px;margin-left:-9px;background:url(sprites/rice.png) 0 0/100% 100%;image-rendering:pixelated}
.bossRow{display:grid;grid-template-columns:72px 1fr 104px;gap:10px;align-items:center;background:var(--panel);border:3px solid var(--line);padding:6px 8px}
.bossRow img{width:72px;height:72px;image-rendering:pixelated}.bossRow.locked img{filter:brightness(0) opacity(.55)}.bossRow b{display:block}.bossRow button{padding:8px 4px;font-size:14px}
#bossList{display:flex;flex-direction:column;gap:8px}
.fight{position:relative;touch-action:manipulation}#btnBossTap{touch-action:manipulation}#bossInfo{min-height:2.7em}
.bowl{display:none;position:absolute;left:54px;bottom:4px;width:80px;height:56px;background:url(sprites/poke_bowl.png) 0 0/400% 100%;image-rendering:pixelated;z-index:2}.bowl.on{display:block}
.hitNum{position:absolute;right:60px;top:40px;color:var(--gold);font-weight:bold;font-size:20px;pointer-events:none;text-shadow:2px 2px 0 #000;animation:hitNum .5s forwards}@keyframes hitNum{to{transform:translateY(-34px);opacity:0}}
.ic{width:24px;height:24px;image-rendering:pixelated;vertical-align:-6px}.stat{display:inline-flex;align-items:center;gap:5px;font-weight:bold}
button .ic{margin-right:5px}.stats{display:flex;justify-content:center;gap:22px;font-size:18px}
.golden{position:fixed;width:80px;height:56px;image-rendering:pixelated;z-index:10;cursor:pointer;touch-action:none;filter:drop-shadow(0 0 8px #ffd34d);opacity:0}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal.on{display:flex}
.panel{background:var(--bg);border:3px solid var(--gold);padding:14px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:440px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.day{background:var(--panel);border:3px solid var(--line);padding:6px 2px;text-align:center;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
.day .ic{width:32px;height:32px}.day.done{opacity:.4}.day.today{border-color:var(--gold)}.day:last-child{grid-column:span 2}
.menuList{display:flex;flex-direction:column;gap:8px}
#whackGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hole{aspect-ratio:1;background:#40304f;padding:0;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:manipulation}.hole img{width:78%;image-rendering:pixelated;pointer-events:none}
#orderPads{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pad{height:120px;padding:0;touch-action:manipulation}.pad img{width:72px;height:72px;image-rendering:pixelated;pointer-events:none}.pad.lit{background:var(--gold);border-color:var(--text)}
#miniCanvas{height:min(100dvh - 180px,(min(100vw,480px) - 32px)*1.375);width:auto;aspect-ratio:320/440;margin:0 auto;image-rendering:pixelated;touch-action:none;border:3px solid var(--line);display:block}
@media (max-height:760px){#s-home{gap:8px}#s-home button{padding:6px 4px;min-height:46px;line-height:1.1}#s-bag{gap:8px}#s-home .stage{height:230px}#pet{transform:scale(4)}}
@media (max-height:640px){#s-home .stage{height:150px}#pet{transform:scale(2.5)}#s-home button{min-height:42px;padding:8px}}
.iconBtn{min-height:0;padding:0}.iconBtn .ic{margin:0;width:28px;height:28px;vertical-align:middle}#btnAccount{margin-left:auto}
.bagHead{font-weight:bold;color:var(--gold);margin-top:2px}.bossRow button.picked{background:#2f7d5b;border-color:var(--green)}
#langList button{padding:12px}#langList button.picked{background:#2f7d5b;border-color:var(--green)}
#bagList{gap:5px}#bagList .bossRow{grid-template-columns:48px 1fr 84px;gap:8px;padding:2px 8px}#bagList .bossRow img{width:48px;height:48px}#bagList .bossRow button{min-height:38px;padding:4px}#bagList .bossRow.empty img{opacity:.4}#bagList .bossRow.rare{grid-template-columns:48px 1fr;border-color:#78d2f5}
.deadStage{height:150px;display:flex;justify-content:center;align-items:flex-end;filter:grayscale(1) brightness(.75)}#deadPet{transform:scale(2.6)}#btnRevive img{vertical-align:-6px}
#pet{cursor:pointer;touch-action:manipulation}.say{pointer-events:none;z-index:1}.heart{position:absolute;left:50%;top:35%;color:var(--red);font-weight:bold;font-size:28px;pointer-events:none;animation:hitNum .6s forwards}
#padControls{display:none;grid-template-columns:1fr 104px;gap:10px;touch-action:none}#s-mini.pad #padControls{display:grid}#s-mini.pad{gap:6px}
#s-mini.pad #miniCanvas{height:min(100dvh - 300px,(min(100vw,480px) - 32px)*1.375)}.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,50px);gap:4px;justify-content:center}.dpad button{min-height:0;padding:0;touch-action:none}#btnJump{touch-action:none}
.toast{z-index:30;position:fixed;left:16px;right:16px;bottom:24px;max-width:448px;margin:auto;background:#000c;border:2px solid var(--gold);padding:10px;text-align:center;font-weight:bold;pointer-events:none;opacity:0;transition:opacity .2s}.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <section class="screen" id="s-login">
    <h1>SBUFFOGOTCHI</h1>
    <p class="center dim" data-i18n="tagline"></p>
    <input id="user" data-i18n-ph="userPh" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
    <input id="pass" type="password" data-i18n-ph="passPh" autocomplete="current-password">
    <div class="row2"><button class="main" id="btnLogin" data-i18n="login"></button><button id="btnSignup" data-i18n="signup"></button></div>
    <p class="center dim" id="loginMsg"></p>
    <button class="link" id="btnOffline" data-i18n="offline"></button>
    <button class="link" data-settings data-i18n="settings"></button>
  </section>

  <section class="screen" id="s-home">
    <div class="top"><span class="stat"><img class="ic" src="sprites/icons/star.png" alt="" data-i18n-alt="level"><span id="lvl"></span></span><span class="stat streak"><img class="ic" src="sprites/icons/bowl.png" alt="" data-i18n-alt="streak"><span id="streak"></span></span><button class="link" id="btnAccount" style="min-height:0;padding:0"></button><button class="link iconBtn" data-settings><img class="ic" src="sprites/icons/gear.png" alt="" data-i18n-alt="settings"></button></div>
    <div class="xp"><i id="xpFill"></i></div>
    <div class="stage"><div class="say" id="say"></div><div class="sprite" id="pet"></div></div>
    <div class="bars">
      <span><img class="ic" src="sprites/icons/apple.png" alt="" data-i18n-alt="food"></span><div class="bar"><i id="b-food" style="background:var(--gold)"></i></div>
      <span><img class="ic" src="sprites/icons/bolt.png" alt="" data-i18n-alt="energy"></span><div class="bar"><i id="b-energy" style="background:var(--blue)"></i></div>
      <span><img class="ic" src="sprites/icons/smile.png" alt="" data-i18n-alt="joy"></span><div class="bar"><i id="b-joy" style="background:var(--green)"></i></div>
    </div>
    <div class="row2"><button id="btnFeed"><img class="ic" src="sprites/icons/apple.png" alt=""><span data-i18n="feed"></span></button><button id="btnRest"><img class="ic" src="sprites/icons/bolt.png" alt=""><span data-i18n="energy"></span></button></div>
    <div class="row2"><button class="main" id="btnTrain"><img class="ic" src="sprites/icons/rice.png" alt=""><span data-i18n="train"></span></button><button class="boss" id="btnBoss"><img class="ic" src="sprites/icons/trophy.png" alt=""><span id="btnBossLabel"></span></button></div>
    <div class="row2"><button id="btnMinis"><img class="ic" src="sprites/pizza.png" alt=""><span data-i18n="minis"></span></button><button id="btnBag"><img class="ic" src="sprites/icons/backpack.png" alt=""><span data-i18n="bag"></span></button></div>
    <div class="stats"><span class="stat"><img class="ic" src="sprites/icons/dumbbell.png" alt="" data-i18n-alt="strength"><span id="str"></span></span><span class="stat"><img class="ic" src="sprites/icons/trophy.png" alt="" data-i18n-alt="bossesBeaten"><span id="wins"></span></span><span class="stat"><img class="ic" src="sprites/icons/shield.png" alt="" data-i18n-alt="shields"><span id="shields"></span></span></div>
  </section>

  <section class="screen" id="s-bag">
    <h2 data-i18n="bag"></h2>
    <p class="center dim" data-i18n="bagIntro"></p>
    <p class="center" id="bagStatus"></p>
    <div class="menuList" id="bagList"></div>
    <button data-home data-i18n="back"></button>
  </section>

  <section class="screen" id="s-settings">
    <h2 data-i18n="settings"></h2>
    <p class="center dim" data-i18n="language"></p>
    <div class="menuList" id="langList"></div>
    <button id="btnSettingsBack" data-i18n="back"></button>
  </section>

  <section class="screen" id="s-trainMenu">
    <h2 data-i18n="training"></h2>
    <p class="center dim" data-i18n="trainIntro"></p>
    <div class="menuList" id="trainList"></div>
    <button data-home data-i18n="back"></button>
  </section>

  <section class="screen" id="s-minis">
    <h2 data-i18n="minis"></h2>
    <p class="center dim" data-i18n="minisIntro"></p>
    <div class="menuList" id="miniList"></div>
    <button data-home data-i18n="back"></button>
  </section>

  <section class="screen" id="s-whack">
    <h2 data-i18n="whack"></h2>
    <p class="center dim" data-i18n="whackHint"></p>
    <div id="whackGrid"></div>
    <p class="center" id="whackInfo"></p>
  </section>

  <section class="screen" id="s-order">
    <h2 data-i18n="order"></h2>
    <p class="center dim" data-i18n="orderHint"></p>
    <p class="center" id="orderInfo"></p>
    <div id="orderPads"></div>
  </section>

  <section class="screen" id="s-mini">
    <h2 id="miniTitle"></h2>
    <p class="center" id="miniInfo"></p>
    <canvas id="miniCanvas" width="320" height="440"></canvas>
    <div id="padControls">
      <div class="dpad"><button data-dir="up" style="grid-area:1/2">▲</button><button data-dir="left" style="grid-area:2/1">◀</button><button data-dir="down" style="grid-area:2/2">▼</button><button data-dir="right" style="grid-area:2/3">▶</button></div>
      <button class="main" id="btnJump" data-i18n="jumpBtn"></button>
    </div>
    <button id="btnMiniQuit" data-i18n="quit"></button>
  </section>

  <section class="screen" id="s-train">
    <h2 data-i18n="riceWrap"></h2>
    <p class="center dim" data-i18n="riceWrapHint"></p>
    <div class="stage" style="height:220px"><div class="sprite" id="trainPet"></div></div>
    <div class="meter" id="trainMeter"><div class="zone"></div><div class="mark"></div></div>
    <p class="center" id="trainInfo"></p>
    <button class="main" id="btnTrainTap" style="min-height:80px" data-i18n="wrapBtn"></button>
  </section>

  <section class="screen" id="s-bosses">
    <h2 data-i18n="bosses"></h2>
    <p class="center dim" data-i18n="bossesIntro"></p>
    <div id="bossList"></div>
    <button id="btnBossBack" data-i18n="back"></button>
  </section>

  <section class="screen" id="s-boss">
    <h2 id="bossName"></h2>
    <div class="bars"><span data-i18n="bossBar"></span><div class="bar"><i id="b-boss" style="background:var(--red)"></i></div><span data-i18n="youBar"></span><div class="bar"><i id="b-you" style="background:var(--green)"></i></div></div>
    <div class="fight"><div class="sprite" id="fightPet"></div><img id="bossArt" alt=""><div class="bowl" id="bowl"></div></div>
    <p class="center" id="bossInfo"></p>
    <button class="boss" id="btnBossTap" style="min-height:80px"></button>
  </section>
</div>
<div class="modal" id="daily"><div class="panel">
  <h2 data-i18n="dailyTitle"></h2>
  <div class="days" id="dailyDays"></div>
  <button class="main" id="btnClaim" data-i18n="claim"></button>
</div></div>
<div class="modal" id="death"><div class="panel center">
  <h2 data-i18n="deadTitle"></h2>
  <div class="deadStage"><div class="sprite" id="deadPet"></div></div>
  <p id="deadWhy"></p>
  <p class="dim" id="deadLost"></p>
  <p class="dim" id="deadHint"></p>
  <button class="main" id="btnRevive"></button>
  <button id="btnStartOver" data-i18n="startOver"></button>
</div></div>
<div class="toast" id="toast"></div>
<script src="i18n.js"></script>
<script src="cloud.js"></script>
<script src="game.js"></script>
</body>
</html>
